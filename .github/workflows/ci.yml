# Build caching follows docs/adr/0002-build-cache.md:
# rust-cache restores compiled dependencies (DuckDB included) when Cargo.lock
# and the toolchain are unchanged; sccache serves the C++ objects otherwise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # DuckDB's sources are unpacked inside the build directory, so cache keys
  # contain the checkout path; strip it so entries are reusable.
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows is not verified yet: the Python memory cap is Unix-only and
    # nothing has been run there. Remove this once it passes.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes caches; pull requests read them.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python step dependencies
        run: python -m pip install pandas pyarrow

      - name: Test
        env:
          VDA_PYTHON: python
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats
