[package]
name = "vda-desktop"
version = "0.3.0"
edition = "2021"
description = "Tauri 2 shell for the visual data analysis app (ADR-0003)"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde_json = "1"
vda-app = { path = "../../../crates/vda-app" }

[features]
# Serve the built frontend from the binary instead of the dev server. The
# Tauri CLI enables this for `tauri build`; end-to-end tests pass it directly.
custom-protocol = ["tauri/custom-protocol"]
