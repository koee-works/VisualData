[workspace]
resolver = "2"
members = ["crates/vda-core", "crates/vda-app", "crates/vda-server", "apps/desktop/src-tauri"]

# Dependencies (DuckDB above all) are built without debug info. With it, the
# debug DuckDB build alone was 4-5 GB on disk, which also overflows CI cache
# quotas (ADR-0002). Our own crates keep full debug info.
[profile.dev.package."*"]
debug = false
